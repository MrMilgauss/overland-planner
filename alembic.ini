# Alembic for the planner's own migrations (ADR-006). The database URL comes from DATA_DIR (migrations/env.py)
# unless a caller sets sqlalchemy.url. In the image: `docker compose run --rm planner alembic downgrade <rev>` (D90).
[alembic]
script_location = %(here)s/migrations
version_locations = %(here)s/migrations/versions
path_separator = os
