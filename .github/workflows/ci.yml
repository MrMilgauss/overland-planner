# Commit stage (slice 00a, step 01-07): jobs 1 lint, 2 test-python, 4 test-web on every push and PR (D169).
# Step 01-08: jobs 5 image-amd64 and 6 image-arm64 on main pushes and manual runs only. Step 01-09: job 7 e2e on the
# loaded amd64 image, job 8 scoped mutation (main pushes touching domain/application), job 9 publish (D160).
# Actions pinned by commit SHA (D85), runners pinned (D178). Weekly scans live in weekly.yml (never gate deploys).
name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # D170, user decision 2026-11-02: started empty; 02-07 added --run-pending=slice-00b, 03-10 adds
  # --run-pending=slice-01a, in the commit that turns the slice GREEN.
  PENDING_FLAGS: "--run-pending=slice-00b"
  UV_VERSION: "0.11.16"
  # Trivy as a sha256-verified binary (like the lint binaries) rather than aquasecurity/trivy-action, whose tags were
  # rewritten in the March 2026 supply-chain incident.
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256_X64: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
  TRIVY_SHA256_ARM64: e174dff2a6dba5e3ae41f8d0537a6324405bd08132497340304c6b20e0f16a1f

jobs:
  changes:
    name: changes (docs-only filter)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      core: ${{ steps.filter.outputs.core }} # domain/application changed: job 8 mutation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        name: Classify changed paths (docs/** and *.md are docs)
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) base="" ;;
          esac
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # Manual run, new branch or rewritten history: run everything.
            code=true
            docs=true
            core=true
          else
            changed="$(git diff --name-only "$base" HEAD)"
            code=false
            docs=false
            if printf '%s\n' "$changed" | grep -qvE '^docs/|\.md$'; then code=true; fi
            if printf '%s\n' "$changed" | grep -qE '^docs/|\.md$'; then docs=true; fi
            core=false
            if printf '%s\n' "$changed" | grep -qE '^src/overland_planner/(domain|application)/'; then core=true; fi
          fi
          {
            echo "code=$code"
            echo "docs=$docs"
            echo "core=$core"
          } >> "$GITHUB_OUTPUT"
          echo "code changed: $code, docs changed: $docs, domain/application changed: $core"

  lint-docs:
    name: lint-docs (markdownlint)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  lint:
    name: "1 lint"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: uv lock --check
        run: uv lock --check
      - name: ruff format --check
        run: uv run ruff format --check .
      - name: ruff check
        run: uv run ruff check .
      - name: mypy --strict (src)
        run: uv run mypy
      - name: import-linter (brief section 11)
        run: uv run lint-imports
      - name: gitleaks (full history)
        env:
          GITLEAKS_VERSION: "8.30.0" # same as .pre-commit-config.yaml
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          PATH="$RUNNER_TEMP:$PATH" gitleaks git --redact --no-banner .
      - name: hadolint Dockerfile
        env:
          HADOLINT_VERSION: "2.15.1"
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
        run: |
          bin="$RUNNER_TEMP/hadolint"
          curl -fsSL -o "$bin" \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  ${bin}" | sha256sum --check --strict
          chmod +x "$bin"
          PATH="$RUNNER_TEMP:$PATH" hadolint Dockerfile
      - name: shellcheck (pinned, sha256-verified; same release as shellcheck-py in make lint-ci and pre-commit)
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL -o "$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xJf "$archive" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "$RUNNER_TEMP/shellcheck" --version
      - name: actionlint (workflows, with the pinned shellcheck)
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck "$RUNNER_TEMP/shellcheck"
      - name: shellcheck .github/scripts/*.sh deploy/scripts/*.sh (severity info, as make lint-ci and pre-commit)
        run: '"$RUNNER_TEMP/shellcheck" --severity=info .github/scripts/*.sh deploy/scripts/*.sh'
      - name: npm ci (web)
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: svelte-check
        working-directory: web
        run: npm run check
      - name: eslint
        working-directory: web
        run: npx --no-install eslint . --max-warnings=0
      - name: prettier --check
        working-directory: web
        run: npx --no-install prettier --check .
      - name: pip-audit (runtime dependencies, blocking on any known vulnerability)
        run: |
          uv export --frozen --no-dev --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: npm audit (runtime dependencies, high and above)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  test-python:
    name: "2 test-python"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLANNER_TEST_WORKSPACE: ${{ github.workspace }}/.data/ci
      DATA_DIR: ${{ github.workspace }}/.data/ci/data
      HYPOTHESIS_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web page (D162)
        working-directory: web
        run: npm ci --no-audit --no-fund && npx vite build
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: Filesystem type of the test data folders, walking skeleton included (D168)
        run: |
          # PLANNER_TEST_WORKSPACE is the root of every test data folder: DATA_DIR and the acceptance
          # conftest's per-scenario folders (the walking skeleton's among them) live under it.
          mkdir -p "$DATA_DIR"
          df -T "$PLANNER_TEST_WORKSPACE"
          {
            echo "### Test data folder filesystem"
            echo '```'
            df -T "$PLANNER_TEST_WORKSPACE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: pytest (coverage >= 80 %)
        run: |
          # shellcheck disable=SC2086 # PENDING_FLAGS is a list of flags
          uv run pytest -q $PENDING_FLAGS -m "not real_provider and not pi" \
            --cov=overland_planner --cov-report=term --cov-fail-under=80
      - name: Domain coverage (>= 90 %)
        run: uv run coverage report --include='*/overland_planner/domain/*' --fail-under=90

  test-web:
    name: "4 test-web"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci --no-audit --no-fund
      - name: vitest
        run: npx --no-install vitest run
      - name: vite build
        run: npx --no-install vite build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 3

  image-amd64:
    name: "5 image-amd64"
    needs: [changes, lint, test-python, test-web]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: # D161: only the image and publish jobs may write packages; D195: no GitHub attestations
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }} # empty unless a main push; publish (job 9) assembles the index
      artifact-id: ${{ steps.image-artifact.outputs.artifact-id }} # e2e (job 7) deletes it after loading (D169)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Build metadata (GIT_SHA, COMMIT_TS, ALEMBIC_HEAD)
        run: |
          # The single Alembic head of migrations/versions (revision not named as any down_revision), parsed from the
          # sources so the label needs no Python environment; more than one head fails the build.
          alembic_head="$(python3 - <<'PY'
          import pathlib
          import re

          texts = [path.read_text() for path in pathlib.Path("migrations/versions").glob("*.py")]


          def found(name):
              pattern = rf"^{name}\b[^=]*=\s*[\"']([^\"']+)[\"']"
              return {match for text in texts for match in re.findall(pattern, text, re.M)}


          heads = sorted(found("revision") - found("down_revision"))
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head in migrations/versions, found {heads}")
          print(heads[0])
          PY
          )"
          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "commit_ts=$(git log -1 --format=%cI)"
            echo "alembic_head=${alembic_head}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the amd64 image as a docker tarball (every image run; e2e artifact, D163)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=docker,dest=/tmp/planner-amd64.tar
          tags: overland-planner:ci-amd64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            COMMIT_TS=${{ steps.meta.outputs.commit_ts }}
            ALEMBIC_HEAD=${{ steps.meta.outputs.alembic_head }}
      - name: Install trivy (sha256-verified)
        run: |
          case "$RUNNER_ARCH" in
            X64) asset=Linux-64bit; sum="$TRIVY_SHA256_X64" ;;
            ARM64) asset=Linux-ARM64; sum="$TRIVY_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz"
          echo "${sum}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Trivy HIGH findings (reported, non-blocking)
        run: |
          trivy image --input /tmp/planner-amd64.tar --scanners vuln,secret --severity HIGH --exit-code 0 --no-progress \
            --format table --output "$RUNNER_TEMP/trivy-high.txt"
          cat "$RUNNER_TEMP/trivy-high.txt"
          {
            echo "### Trivy HIGH findings (amd64, report only)"
            echo '```'
            cat "$RUNNER_TEMP/trivy-high.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy CRITICAL with a fix (blocking)
        run: |
          trivy image --input /tmp/planner-amd64.tar --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress
      - name: Compressed image size (D169)
        run: |
          zstd -T0 -10 -q -f /tmp/planner-amd64.tar -o /tmp/planner-amd64.tar.zst
          size="$(stat -c %s /tmp/planner-amd64.tar.zst)"
          echo "Compressed amd64 image: $((size / 1048576)) MiB (${size} bytes)" >> "$GITHUB_STEP_SUMMARY"
      - id: image-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: planner-image-amd64
          path: /tmp/planner-amd64.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # already zstd
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push by digest with SBOM and provenance (main only; cache hit of the build above)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/mrmilgauss/overland-planner,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=amd64
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            COMMIT_TS=${{ steps.meta.outputs.commit_ts }}
            ALEMBIC_HEAD=${{ steps.meta.outputs.alembic_head }}

  image-arm64:
    name: "6 image-arm64"
    needs: [changes, lint, test-python, test-web]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    # QEMU on the hosted amd64 runner unless the repository variable ARM64_RUNNER names a native arm64 runner.
    runs-on: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions: # D161: only the image and publish jobs may write packages; D195: no GitHub attestations
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }} # empty unless a main push; publish (job 9) assembles the index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        name: Build metadata (GIT_SHA, COMMIT_TS, ALEMBIC_HEAD)
        run: |
          # The single Alembic head of migrations/versions (revision not named as any down_revision), parsed from the
          # sources so the label needs no Python environment; more than one head fails the build.
          alembic_head="$(python3 - <<'PY'
          import pathlib
          import re

          texts = [path.read_text() for path in pathlib.Path("migrations/versions").glob("*.py")]


          def found(name):
              pattern = rf"^{name}\b[^=]*=\s*[\"']([^\"']+)[\"']"
              return {match for text in texts for match in re.findall(pattern, text, re.M)}


          heads = sorted(found("revision") - found("down_revision"))
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head in migrations/versions, found {heads}")
          print(heads[0])
          PY
          )"
          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "commit_ts=$(git log -1 --format=%cI)"
            echo "alembic_head=${alembic_head}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: runner.arch != 'ARM64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load the arm64 image (every image run; the smoke runs it)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: overland-planner:ci-arm64
          provenance: false
          sbom: false
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            COMMIT_TS=${{ steps.meta.outputs.commit_ts }}
            ALEMBIC_HEAD=${{ steps.meta.outputs.alembic_head }}
      - name: Save the arm64 image for the scan
        run: docker save overland-planner:ci-arm64 -o /tmp/planner-arm64.tar
      - name: Install trivy (sha256-verified)
        run: |
          case "$RUNNER_ARCH" in
            X64) asset=Linux-64bit; sum="$TRIVY_SHA256_X64" ;;
            ARM64) asset=Linux-ARM64; sum="$TRIVY_SHA256_ARM64" ;;
            *) echo "unsupported runner architecture $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_${asset}.tar.gz"
          echo "${sum}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Trivy HIGH findings (reported, non-blocking)
        run: |
          trivy image --input /tmp/planner-arm64.tar --scanners vuln,secret --severity HIGH --exit-code 0 --no-progress \
            --format table --output "$RUNNER_TEMP/trivy-high.txt"
          cat "$RUNNER_TEMP/trivy-high.txt"
          {
            echo "### Trivy HIGH findings (arm64, report only)"
            echo '```'
            cat "$RUNNER_TEMP/trivy-high.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy CRITICAL with a fix (blocking)
        run: |
          trivy image --input /tmp/planner-arm64.tar --scanners vuln,secret --severity CRITICAL --ignore-unfixed --exit-code 1 \
            --no-progress
      - name: Compressed image size (D169)
        run: |
          zstd -T0 -10 -q -f /tmp/planner-arm64.tar -o /tmp/planner-arm64.tar.zst
          size="$(stat -c %s /tmp/planner-arm64.tar.zst)"
          echo "Compressed arm64 image: $((size / 1048576)) MiB (${size} bytes)" >> "$GITHUB_STEP_SUMMARY"
      - name: arm64 functional smoke (/healthz, solver probe, OR-Tools wheel)
        env:
          SMOKE_TIMEOUT: ${{ runner.arch == 'ARM64' && '60' || '180' }} # 180 s under QEMU, 60 s native
        run: .github/scripts/image-smoke.sh overland-planner:ci-arm64 "$SMOKE_TIMEOUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push by digest with SBOM and provenance (main only; cache hit of the build above)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/mrmilgauss/overland-planner,push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=arm64
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.git_sha }}
            COMMIT_TS=${{ steps.meta.outputs.commit_ts }}
            ALEMBIC_HEAD=${{ steps.meta.outputs.alembic_head }}

  e2e:
    name: "7 e2e"
    needs: image-amd64
    runs-on: ubuntu-24.04
    # < 9 min target; the packaged-planner password check rebuilds the image with plain `docker build` (no gha cache
    # on the docker driver), which dominates once slice 00b is enabled.
    timeout-minutes: 25
    permissions:
      contents: read
      actions: write # delete the image artifact after loading it (D169)
    env:
      PLANNER_URL: http://127.0.0.1:8080
      # compose.yaml fails closed without PLANNER_BIND and PLANNER_IMAGE (D174) and is interpolated before any override,
      # so both are job-level for every compose run; compose.ci.yaml then pins the ports to loopback and never pulls.
      PLANNER_BIND: 127.0.0.1
      PLANNER_IMAGE: overland-planner:ci-${{ github.sha }}
      PLANNER_TEST_WORKSPACE: ${{ github.workspace }}/.data/ci
      DATA_DIR: ${{ github.workspace }}/.data/ci/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planner-image-amd64
          path: ${{ runner.temp }}/image
      - name: docker load the amd64 image (D163)
        run: |
          zstd -d -q --rm "$RUNNER_TEMP/image/planner-amd64.tar.zst" -o "$RUNNER_TEMP/image/planner-amd64.tar"
          docker load -i "$RUNNER_TEMP/image/planner-amd64.tar"
          rm -f "$RUNNER_TEMP/image/planner-amd64.tar"
          docker tag overland-planner:ci-amd64 "overland-planner:ci-${GITHUB_SHA}"
      - name: Delete the image artifact (D169, artifact storage)
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.image-amd64.outputs.artifact-id }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}"
      - name: Start the planner with compose (compose.yaml + compose.ci.yaml, loopback, step 02-04)
        run: docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml up -d --wait --wait-timeout 120
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci and the Playwright browsers
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium webkit
      - name: Playwright home page (chromium, webkit-iphone14)
        working-directory: web
        # tests/e2e lives outside web/: NODE_PATH lets the spec resolve @playwright/test from web/node_modules.
        run: NODE_PATH="$PWD/node_modules" npx --no-install playwright test --project=chromium --project=webkit-iphone14
      - name: Planner logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml logs planner || true
      - name: Stop the compose stack and remove its volume
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml down -v || true
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: uv sync --frozen
        run: uv sync --frozen
      # Step 03-02 (D121): no volume on /data -> overlay -> /healthz 503 with the not-persistent reason. Reported only
      # until step 03-10 enables slice 01a in PENDING_FLAGS; the selection below then runs it as a blocking check.
      - name: Packaged planner without its data storage (slice 01a, non-blocking until 03-10)
        continue-on-error: true
        run: >-
          uv run pytest -q -rs --run-external --run-pending=slice-01a -m compose
          -k without_its_data_storage tests/acceptance/overland_route_planner_mvp/test_slice_01a.py
      # Includes tests/deploy: compose fails closed without PLANNER_BIND, and the hardened container writes only
      # /data and /tmp (D173).
      - name: pytest --run-external -m "compose or security" (D170)
        run: .github/scripts/pytest-selection.sh "compose or security"

  mutation:
    name: "8 mutation"
    needs: [changes, test-python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLANNER_TEST_WORKSPACE: ${{ github.workspace }}/.data/ci
      DATA_DIR: ${{ github.workspace }}/.data/ci/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff before..sha scopes the run
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web page (mutmut copies web/dist)
        working-directory: web
        run: npm ci --no-audit --no-fund && npx vite build
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: mutmut on the domain/application files changed in before..sha (kill rate >= 80 %)
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=all # new branch or forced push: every domain/application file
          fi
          status=0
          make mutate BASE="$base" 2>&1 | tee "$RUNNER_TEMP/mutate.log" || status=$?
          {
            echo "### Mutation (BASE=${base})"
            grep '^mutate:' "$RUNNER_TEMP/mutate.log" || echo "no mutate summary line"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  publish:
    name: "9 publish"
    needs: [image-amd64, image-arm64, e2e, mutation]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image-amd64.result == 'success' && needs.image-arm64.result == 'success' && needs.e2e.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.mutation.result)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: # D161, D195
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: list
        name: imagetools create the manifest list sha-<12> and main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/mrmilgauss/overland-planner
          AMD64: ${{ needs.image-amd64.outputs.digest }}
          ARM64: ${{ needs.image-arm64.outputs.digest }}
        run: |
          test -n "$AMD64" && test -n "$ARM64"
          docker buildx imagetools create -t "${IMAGE}:sha-${GITHUB_SHA::12}" -t "${IMAGE}:main" "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:sha-${GITHUB_SHA::12}" --format '{{json .Manifest}}' | jq -r .digest)"
          test -n "$digest" && [ "$digest" != null ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify the buildx provenance of both platforms (D195; fails closed before release.json)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/mrmilgauss/overland-planner
          DIGEST: ${{ steps.list.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --format '{{json .Provenance}}' > "$RUNNER_TEMP/provenance.json"
          repo="https://github.com/${GITHUB_REPOSITORY,,}"
          : > "$RUNNER_TEMP/provenance-errors"
          {
            echo "### Provenance of ${IMAGE}@${DIGEST} (buildx in-registry, D195)"
            echo "Expected source \`${repo}\` at \`${GITHUB_SHA}\`."
            echo '```json'
            for platform in linux/amd64 linux/arm64; do
              vcs="$(jq -c --arg p "$platform" '[.[$p] // {} | .. | objects | .vcs | objects] | first // {}' \
                "$RUNNER_TEMP/provenance.json")"
              echo "{\"${platform}\": ${vcs}}"
              source="$(jq -r '.source // "" | ascii_downcase | sub("\\.git$"; "")' <<< "$vcs")"
              revision="$(jq -r '.revision // ""' <<< "$vcs")"
              if [ "$source" != "$repo" ] || [ "$revision" != "$GITHUB_SHA" ]; then
                echo "${platform} provenance names '${source}' at '${revision}', expected ${repo} at ${GITHUB_SHA}" \
                  >> "$RUNNER_TEMP/provenance-errors"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/provenance-errors" ]; then
            sed 's/^/::error::/' "$RUNNER_TEMP/provenance-errors"
            exit 1
          fi
      - name: release.json (make deploy downloads it, D171)
        env:
          DIGEST: ${{ steps.list.outputs.digest }}
        run: |
          # Same head computation as the image jobs' build metadata (org.overland.alembic-head).
          alembic_head="$(python3 - <<'PY'
          import pathlib
          import re

          texts = [path.read_text() for path in pathlib.Path("migrations/versions").glob("*.py")]


          def found(name):
              pattern = rf"^{name}\b[^=]*=\s*[\"']([^\"']+)[\"']"
              return {match for text in texts for match in re.findall(pattern, text, re.M)}


          heads = sorted(found("revision") - found("down_revision"))
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head in migrations/versions, found {heads}")
          print(heads[0])
          PY
          )"
          jq -n --arg git_sha "$GITHUB_SHA" --arg commit_ts "$(git log -1 --format=%cI)" --arg digest "$DIGEST" \
            --arg alembic_head "$alembic_head" --arg created "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{git_sha: $git_sha, commit_ts: $commit_ts, digest: $digest, alembic_head: $alembic_head, created: $created,
              provenance: "buildx"}' \
            > "$RUNNER_TEMP/release.json"
          {
            echo "### Release ghcr.io/mrmilgauss/overland-planner:sha-${GITHUB_SHA::12}"
            echo '```json'
            cat "$RUNNER_TEMP/release.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release.json
          path: ${{ runner.temp }}/release.json
          if-no-files-found: error
          retention-days: 90
      - name: Prune GHCR to this release and the manifests it references (D169; skips when ambiguous)
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.list.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type == 'Organization' && 'orgs' || 'users' }}
        run: |
          python3 .github/scripts/ghcr_prune.py --owner "$OWNER" --owner-type "$OWNER_TYPE" \
            --package overland-planner --digest "$DIGEST"
