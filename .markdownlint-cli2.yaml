# Markdown lint for docs-only pushes (CI job lint-docs, step 01-07).
# The docs are wide decision tables and long prose lines, so purely stylistic rules are off. The structural rules
# switched off below still have hits in the existing docs; re-enable each one in the docs-hygiene task that fixes them.
config:
  default: true
  # Stylistic: wide tables, long prose lines, table pipe alignment, list/heading spacing, inline HTML comments.
  MD013: false
  MD060: false
  MD032: false
  MD022: false
  MD033: false
  MD004: false
  MD058: false
  MD031: false
  MD012: false
  MD040: false
  # Existing hits (docs-hygiene backlog): re-enable once fixed.
  MD001: false
  MD024: false
  MD029: false
  MD037: false
  MD038: false
  MD056: false
ignores:
  - "**/node_modules/**"
  - ".venv/**"
  - "mutants/**"
  - ".pytest_cache/**"
