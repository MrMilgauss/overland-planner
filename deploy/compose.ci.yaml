# CI job 7 override (step 02-04): the image loaded from the job 5 artifact, never pulled, on loopback only.
#
#   PLANNER_BIND=127.0.0.1 PLANNER_IMAGE=overland-planner:ci-$GITHUB_SHA \
#     docker compose -f deploy/compose.yaml -f deploy/compose.ci.yaml up -d --wait
#
# compose.yaml is interpolated before this file is merged, so PLANNER_BIND and PLANNER_IMAGE must be set in the
# environment (job 7 sets both at job level); the ports are then replaced here.
#
# The road map is the fixture one (slice 12c): `.github/scripts/build-road-map-fixture.py $ROAD_MAP_FIXTURE_DIR` makes
# `volume/` (the tileset folder, read-only in the container) and `changes/` (world-writable: the specs write the helper's
# notes there from outside), and ROAD_MAP_SERVED_TILESET names the tileset the offline road map serves.
services:
  planner:
    pull_policy: never
    ports: !override
      - "127.0.0.1:8080:8080"
    # The place search is the fake of .github/scripts/fake-place-search.py, started by job 7 on the runner (slice 12c).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ROAD_MAP_SERVED_TILESET: "20261127"
      PLACE_SEARCH_URL: "http://host.docker.internal:8765/search"
    volumes: !override
      - planner-data:/data
      - ${ROAD_MAP_FIXTURE_DIR:?run .github/scripts/build-road-map-fixture.py and set ROAD_MAP_FIXTURE_DIR}/volume:/valhalla-data:ro
      - ${ROAD_MAP_FIXTURE_DIR:?run .github/scripts/build-road-map-fixture.py and set ROAD_MAP_FIXTURE_DIR}/changes:/road-map-changes
