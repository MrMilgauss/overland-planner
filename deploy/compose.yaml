# Overland route planner on the home server (slice 00b; D81, D82, D83, D167, D173, D174; brief section 15).
#
#   docker compose -p overland --env-file .env --env-file release.env up -d --wait
#
# .env (copied from .env.example, never committed) holds PLANNER_BIND and the settings; release.env (written by
# deploy.sh) holds PLANNER_IMAGE. Only the planner is published, on PLANNER_BIND, which has no default: compose
# refuses to start without it (fail-closed, D174).
#
# valhalla (profile `routing`, slice 06a-ops; ADR-013 Amendment 3, D234, D239): the routing engine, serving the tileset
# `tilesets/$VALHALLA_TILESET` of the volume overland_valhalla-data (seeded by `make tiles-seed`), on the internal
# network `routing` only and never published. The planner does not depend on it. The Pi tooling adds
# `--env-file routing.env --profile routing` only when routing.env exists; `none` as the default tileset only lets the
# file parse (a start without a seeded tileset fails at the mount, as it should).
#
# valhalla-fetch and valhalla-build (profile `valhalla-build`, slice 06a-ops; D81, D239): the one-shot services of a map
# data refresh, run by `make tiles-refresh` (08-05) with `compose run --rm`, never started by `up`. valhalla-fetch
# downloads and merges the extract and is the only service on the plain bridge `egress`; valhalla-build converts it to
# tiles with no network at all. Both mount the subpath `build` of overland_valhalla-data, which must exist before the
# mount: the refresh script creates it.
#
# valhalla-tunnel (profile `ops`, slice 06a-ops; D95, D164, D235): started only by `make contract-live`, it forwards
# 127.0.0.1:18002 of the Pi to valhalla:8002 so the Mac reaches the engine through `ssh -L`. valhalla itself is never
# published. Stopped and removed by the same run.
#
# planner-perf (profile `perf`, slice 03-ops; D96, D164, D167, D173): the planner's image (the deployed digest of
# release.env), environment, caps, hardening and healthcheck, on its own volume overland_planner-perf-data and only on
# 127.0.0.1:18080, reached by `make perf-pi` through an ssh tunnel. MOCK_PLAN comes from PERF_MOCK_PLAN (I2's road map,
# copied by perf-pi into ./perf, read-only). The default profile never starts it.
name: overland

services:
  planner: &planner
    image: ${PLANNER_IMAGE:?PLANNER_IMAGE must be set (release.env from deploy.sh)}
    init: true
    restart: unless-stopped
    ports:
      - "${PLANNER_BIND:?PLANNER_BIND must be set in .env}:${PLANNER_PORT:-8080}:8080"
    networks:
      - edge
      - routing
    # Settings reach the container by interpolation from .env; nothing is baked into the image. WEB_DIST_DIR,
    # MIGRATIONS_DIR and PLANNER_GIT_SHA are set by the image itself.
    environment: &planner-environment
      DATA_DIR: /data
      # The road map: `mock` (offline) unless .env says ROUTING_PROVIDER=valhalla (D247); the engine tuning is empty when
      # unset, which the planner reads as its default.
      ROUTING_PROVIDER: ${ROUTING_PROVIDER:-mock}
      VALHALLA_URL: http://valhalla:8002
      VALHALLA_EXPECTED_VERSION: ${VALHALLA_EXPECTED_VERSION:-}
      VALHALLA_MAX_MATRIX_PAIRS: ${VALHALLA_MAX_MATRIX_PAIRS:-}
      VALHALLA_CONCURRENCY: ${VALHALLA_CONCURRENCY:-}
      CONFIRMED_SNAP_M: ${CONFIRMED_SNAP_M:-}
      # The map's tiles (ADR-004): empty when unset, which the planner reads as OpenTopoMap with its credit.
      MAP_TILE_URL: ${MAP_TILE_URL:-}
      MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
      MAP_TILE_MAX_ZOOM: ${MAP_TILE_MAX_ZOOM:-}
      # The light base map (ADR-004 Amendment 1): empty when unset, which the planner reads as OpenFreeMap Positron.
      MAP_BASE_STYLE_URL: ${MAP_BASE_STYLE_URL:-}
      MAP_BASE_ATTRIBUTION: ${MAP_BASE_ATTRIBUTION:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SOLVER_BUDGET: ${SOLVER_BUDGET:-10000}
      # Solve limits in whole seconds from pressing Calculate (ADR-014 section 2); feasibility <= optimisation.
      FEASIBILITY_LIMIT_S: ${FEASIBILITY_LIMIT_S:-600}
      OPTIMISATION_LIMIT_S: ${OPTIMISATION_LIMIT_S:-1800}
      PLANNER_BASIC_AUTH_USER: ${PLANNER_BASIC_AUTH_USER:-}
      PLANNER_BASIC_AUTH_PASSWORD: ${PLANNER_BASIC_AUTH_PASSWORD:-}
      # Trail upload caps; empty when unset in .env, which the planner reads as its default (25 MiB, 100 MiB, 50).
      MAX_UPLOAD_FILE_MB: ${MAX_UPLOAD_FILE_MB:-}
      MAX_UPLOAD_REQUEST_MB: ${MAX_UPLOAD_REQUEST_MB:-}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-}
      # The road map (slice 12c; D301, D316): the folders are fixed by the mounts below, so the Road map screen is wired
      # on the Pi whatever .env says; the other settings are empty when unset, which the planner reads as its default.
      ROAD_MAP_DIR: /valhalla-data/tilesets
      ROAD_MAP_CHANGES_DIR: /road-map-changes
      ROAD_MAP_MAX_GB: ${ROAD_MAP_MAX_GB:-}
      PLACE_SEARCH: ${PLACE_SEARCH:-}
      PLACE_SEARCH_URL: ${PLACE_SEARCH_URL:-}
      GEOFABRIK_INDEX_URL: ${GEOFABRIK_INDEX_URL:-}
    # /road-map-changes: the planner's requests to the Pi's helper (D303). /valhalla-data: the whole engine volume,
    # read-only, so a Pi with no tileset yet still starts the planner (D234; a subpath that is missing stops the container).
    volumes:
      - planner-data:/data
      - road-map:/road-map-changes
      - valhalla-data:/valhalla-data:ro
    # Resource caps (D83, D167): the Pi keeps room for the routing engine.
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    oom_score_adj: 500
    # Hardening (D173): uid 10001 from the image, no capabilities, read-only root; writes only /data, /tmp and /road-map-changes (D303).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Same curl-free probe as the image HEALTHCHECK, stated here so `up --wait` does not depend on the image.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  planner-perf:
    <<: *planner
    profiles: ["perf"]
    restart: "no"
    ports:
      - "127.0.0.1:18080:8080"
    networks:
      - edge
      - routing
    environment:
      <<: *planner-environment
      MOCK_PLAN: ${PERF_MOCK_PLAN:-}
      # make perf-pi MODE=e2e and make acceptance-pi set PERF_ROUTING_PROVIDER=valhalla (D236); the planner stays on mock.
      ROUTING_PROVIDER: ${PERF_ROUTING_PROVIDER:-mock}
    volumes:
      - planner-perf-data:/data
      - ./perf:/perf:ro
      # a list replaces the planner's: the two map mounts again, read-only (a measurement planner changes no map)
      - road-map:/road-map-changes:ro
      - valhalla-data:/valhalla-data:ro

  valhalla:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla-scripted:3.9.1-arm64@sha256:f182f45e9e71cbe737e6c394d68808c67a7bd12e2a4cc47c4aba864de77ecdc6}
    profiles: ["routing"]
    restart: unless-stopped
    networks:
      - routing
    # Serve the seeded tiles only: no build, no download, no config rewrite.
    environment:
      serve_tiles: "True"
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
      server_threads: "2"
      update_existing_config: "False"
      build_admins: "False"
      build_time_zones: "False"
      build_elevation: "False"
      build_transit: "False"
    volumes:
      - type: volume
        source: valhalla-data
        target: /custom_files
        volume:
          subpath: tilesets/${VALHALLA_TILESET:-none}
    # Caps (D83): planner 1g + valhalla 4g stay within 5 GiB. The image runs as root and writes beside the tiles, so
    # no cap_drop and no read_only (D239).
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    oom_score_adj: 500
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The maintenance tunnel (D164, D235): a socat forwarder on the Pi's loopback, for `make contract-live` only.
  valhalla-tunnel:
    image: alpine/socat:1.8.0.3@sha256:beb4a68d9e4fe6b0f21ea774a0fde6c31f580dde6368939ed70100c5385b015e
    profiles: ["ops"]
    restart: "no"
    command: TCP-LISTEN:8002,fork,reuseaddr TCP:valhalla:8002
    ports:
      - "127.0.0.1:18002:8002"
    networks:
      - edge
      - routing
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 64m

  # Map data refresh (D239): the tile build needs no network, so it has none; the fetch is the only way out.
  valhalla-fetch:
    image: debian:bookworm-slim@sha256:734a72b3d6142a71993b4bc580ca01d8ca687f77a2c422d96a961d3376b179bc
    profiles: ["valhalla-build"]
    restart: "no"
    networks:
      - egress
    volumes:
      - type: volume
        source: valhalla-data
        target: /work
        volume:
          subpath: build
      # the borders (.poly) of the regions of a rebuild: the refresh makes road-map-meta/ before the run (D314)
      - type: volume
        source: valhalla-data
        target: /meta
        volume:
          subpath: road-map-meta
    cpus: 2
    mem_limit: 6g
    memswap_limit: 6g
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  valhalla-build:
    image: ${VALHALLA_IMAGE:-ghcr.io/valhalla/valhalla-scripted:3.9.1-arm64@sha256:f182f45e9e71cbe737e6c394d68808c67a7bd12e2a4cc47c4aba864de77ecdc6}
    profiles: ["valhalla-build"]
    restart: "no"
    network_mode: none
    environment:
      build_admins: "True"
      # The image downloads the time-zone db only when /custom_files/timezones.sqlite is absent; with no network
      # tiles-refresh.sh carries the serving tileset's file into build/ first, so "True" only matters for a run with network.
      build_time_zones: "True"
      build_elevation: "False"
      build_transit: "False"
      serve_tiles: "False"
      force_rebuild: "True"
      server_threads: "3"
    volumes:
      - type: volume
        source: valhalla-data
        target: /custom_files
        volume:
          subpath: build
    cpus: 3
    mem_limit: ${VALHALLA_BUILD_MEM:-9g}
    memswap_limit: ${VALHALLA_BUILD_MEM:-9g}
    oom_score_adj: 500
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

networks:
  edge: {}
  egress: {}
  routing:
    internal: true

volumes:
  planner-data:
    name: overland_planner-data
  planner-perf-data:
    name: overland_planner-perf-data
  valhalla-data:
    name: overland_valhalla-data
  road-map:
    name: overland_road-map
