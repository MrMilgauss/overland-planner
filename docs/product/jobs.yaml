schema_version: 1
# SSOT for jobs-to-be-done. Bootstrapped by DISCUSS wave of feature overland-route-planner-mvp.
# Evidence level for ALL jobs: requirements-doc derived, unvalidated.
# No interviews, observation or DIVERGE job analysis exist. Source: REQUIREMENTS.md (sections 1, 3, 4, 5, 8).
# Opportunity score = importance + max(importance - satisfaction, 0)  (Ulwick ODI, 1-10 scales).
# Importance/satisfaction are analyst estimates from REQUIREMENTS.md emphasis, NOT measured.

meta:
  created: 2026-11-01
  created_by: nw-product-owner (DISCUSS, overland-route-planner-mvp)
  evidence_level: "requirements-doc derived, unvalidated"
  primary_persona: overland-planner
  validation_todo: "Re-score importance/satisfaction after first dogfood trip plan (slices 01a, 01b, 02)."
  story_link_rule: "Each story lists exactly ONE primary job (Revision 1, S11)."

jobs:
  - id: J-01
    name: plan-complete-trip
    job_story: >
      When I have collected the trails and places I want to see on an overlanding holiday,
      I want one drivable itinerary that visits every one of them between my fixed start and end
      with as little road driving and backtracking as possible,
      so I can spend my days on trails instead of on tarmac.
    dimensions:
      functional: "Order 5-40 tracks and 5-30 POIs into a single route from Start to End that minimises road km (default) or road time."
      emotional: "Feel that the plan is the best I could reasonably get, without hours of manual juggling in a spreadsheet."
      social: "Show the household a credible plan (where we sleep, how long we drive) that they can read on a phone."
    four_forces:
      push: "Manual ordering in a spreadsheet plus a consumer route planner takes days and still backtracks; consumer planners ignore trail direction."
      pull: "Press Optimize and get an ordered itinerary with totals in seconds."
      anxiety: "Will the optimizer pick a silly order, or quietly leave something out?"
      habit: "Planning by eye on a paper map / OsmAnd favourites, ordering trails by region."
    importance: 10
    satisfaction: 3
    opportunity_score: 17
    stories: [US-02a, US-02c, US-02b, US-04, US-06a, US-06b, US-10a, US-10b, US-12, US-16, US-20, US-21, US-23, US-24, US-25, US-26]   # primary job only (S11)

  - id: J-02
    name: trust-trail-integrity
    job_story: >
      When I commit to driving a trail that may be impassable in the other direction,
      I want to be certain the plan drives every trail in full, from its recorded entry to its recorded exit,
      so I can never end up at the bottom of a descent I cannot climb.
    dimensions:
      functional: "Every track is traversed entry->exit, whole, never reversed or cut; direction changes only by my explicit action. A dead-end trail may be retraced exit->entry as a separate, clearly flagged leg, never entered from its exit (HC-1 revised 2026-11-01)."
      emotional: "Safety and trust; no second-guessing of the computer's choices on the mountain."
      social: "Responsible overlanding: drive trails the way they are meant (and sometimes legally signed) to be driven."
    four_forces:
      push: "Generic optimizers and route planners freely reverse or clip GPX tracks to save distance."
      pull: "A hard guarantee, visible on the map as arrows and entry/exit markers."
      anxiety: "A GPX file recorded backwards gets planned the wrong way round; broken files produce nonsense entries."
      habit: "Checking each trail's direction by hand against forum trip reports."
    importance: 10
    satisfaction: 2
    opportunity_score: 18
    stories: [US-03, US-11a, US-11b, US-13, US-14, US-15, US-19, US-22]

  - id: J-03
    name: iterate-selection-cheaply
    job_story: >
      When I am weighing which trails to keep or drop to fit my holiday,
      I want to toggle items, recalculate, and see exactly what changed without re-entering anything or waiting for everything to be recomputed,
      so I can compare trade-offs in minutes instead of rebuilding the plan.
    dimensions:
      functional: "Toggle/add/remove -> Recalculate reuses known legs; new run shows diff (added/removed/moved items, delta totals); identical inputs give identical plans."
      emotional: "Freedom to experiment; no fear of losing a good plan."
      social: "Negotiate the trip with the household: 'dropping Via del Sale saves 140 road km'."
    four_forces:
      push: "Each change in today's workflow means redoing the whole route by hand."
      pull: "Cheap what-if iterations with a clear diff."
      anxiety: "Recalculating might give a different plan for no reason, or burn hosted routing quota."
      habit: "Saving many copies of a spreadsheet, one per variant."
    importance: 8
    satisfaction: 2
    opportunity_score: 14
    stories: [US-05, US-07a, US-09a, US-09b, US-17]   # US-09 split 2026-11-02 (D143)

  - id: J-04
    name: take-trip-to-device
    job_story: >
      When my plan is final and I am about to leave,
      I want the whole trip as one standard GPX that loads cleanly in OsmAnd, Locus Map or my Garmin,
      so I can follow it from the cab without rebuilding anything on the device.
    dimensions:
      functional: "Single GPX 1.1 file: road legs, tracks at original resolution, POIs as waypoints, in itinerary order."
      emotional: "Relief: the plan I trust is the plan I will see on the dashboard."
      social: "Share the same file with a travel companion's device."
    four_forces:
      push: "Copying routes between tools loses track resolution or order."
      pull: "One download, one import."
      anxiety: "The navigation app rejects the file or silently re-routes the trail segments."
      habit: "Importing each trail GPX separately into OsmAnd."
    importance: 9
    satisfaction: 5
    opportunity_score: 13
    stories: [US-18a, US-18b]

  - id: J-05
    name: know-what-is-included
    job_story: >
      When I look at any plan run,
      I want an explicit list of every item in the project marked Included (with route position) or Excluded, and any failure named with its reason,
      so I can be sure nothing was silently dropped before I commit to the trip.
    dimensions:
      functional: "Consideration report covers 100% of project items; unplaceable items fail the run with item + reason."
      emotional: "Certainty and control."
      social: "Answer 'did we keep the lake?' from the household instantly."
    four_forces:
      push: "Black-box tools omit stops without telling you."
      pull: "A checklist I can read top to bottom."
      anxiety: "An unroutable leg (island, closed pass) makes the planner skip an item quietly."
      habit: "Ticking items off a printed list."
    importance: 8
    satisfaction: 3
    opportunity_score: 13
    stories: [US-07b, US-08]

  - id: J-06
    name: own-planning-on-home-lan
    job_story: >
      When I want to plan a trip from any device at home,
      I want the planner running on my Raspberry Pi with my data on my own disk,
      so I can plan without accounts, subscriptions or my trails leaving the house.
    dimensions:
      functional: "docker compose up -d on ARM64; data survives restarts; LAN-only, optional basic auth."
      emotional: "Ownership and calm: it is always there, it is mine."
      social: "Household can open it from their phones on the LAN."
    four_forces:
      push: "Cloud planners require accounts and keep my curated trails."
      pull: "Self-hosted, one command to run."
      anxiety: "Pi too slow; container restart loses projects."
      habit: "Desktop-only tools on one laptop."
    importance: 6
    satisfaction: 4
    opportunity_score: 8
    stories: [US-01a, US-01b]

opportunity_ranking:
  - {rank: 1, job: J-02, score: 18}
  - {rank: 2, job: J-01, score: 17}
  - {rank: 3, job: J-03, score: 14}
  - {rank: 4, job: J-04, score: 13}
  - {rank: 4, job: J-05, score: 13}
  - {rank: 6, job: J-06, score: 8}

