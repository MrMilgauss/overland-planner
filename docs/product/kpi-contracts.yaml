# KPI contracts -- Overland Route Planner
# Created 2026-11-02 by the DEVOPS wave (Apex) for feature overland-route-planner-mvp.
# Source KPIs: feature-delta.md "Wave: DISCUSS / [REF] Outcome KPIs" (K1-K7 + guardrails).
# Instruments: structlog JSON events on stdout (Docker json-file, rotated), the persisted job log
# (plan_job_log, upstream-changes DV-2), plan_runs, and GET /api/diagnostics (DV-3). DV-1..DV-5 accepted by the user 2026-11-02.
# No Prometheus/Grafana and no new services (DEVOPS D93). Thresholds are versioned here, not in code:
# the diagnostics service reads the same numbers from config (DIAG_* keys) whose defaults equal this file.

schema_version: 1
owner: Marco (product), the owner (operator)
review_cadence: weekly during the planning season (make diag), and at every slice demo
timezone_for_day_buckets: Europe/Rome   # PLANNER_TZ; the Pi runs Europe/Zurich (same offset)
exclusions:
  - "jobs and runs from the planner-perf service never reach production data (separate volume)"
  - "projects whose name starts with '__' are excluded from K1/K7 (fixtures loaded by hand)"

common_event_fields:   # present on every event line
  ts: ISO-8601 UTC with ms
  level: info|warning|error
  event: dotted name
  app_version: PLANNER_GIT_SHA (12 chars)
  image_digest: PLANNER_IMAGE digest (sha256:...)
  request_id: per HTTP request (absent for background work)
  job_id: when inside a plan job
  project_id: when applicable

events:
  app.started: [app_version, image_digest, alembic_revision, routing_provider, provider_id, solver_budget, auth_enabled, degraded_reasons]
  health.startup.refused: [component, reason]
  health.startup.degraded: [reason]
  plan.job.refused: [project_id, http_status, reason]          # synchronous refusals (422/409/503): no job row
  plan.job.finished: [job_id, project_id, terminal_state, plan_run_id, items_included, legs_total, legs_new,
                      legs_cached, points_located, points_new, second_pass_pairs, retried, memo_hit, ignore_memo,
                      stage_ms, solver_solutions, incumbents, reproducible, not_fully_optimised_reason,
                      unconfirmed_legs, retraces, provider_id, elapsed_ms]   # NEW (DV-6); one line per job, mirrors plan_job_log
  plan.run.completed: [plan_run_id, number, status, failure_reason, report_items, project_items, invariants]   # brief s12
  plan.run.geometry_served: [plan_run_id, legs, geometry_ms, e2e_server_ms]   # NEW (DV-6); first geometry fetch per run
  invariant.violation: [plan_run_id, check, detail]
  routing.engine.error: [kind, error_code, endpoint, attempt]
  export.gpx: [plan_run_id, project_id, items_included, bytes, stale]
  import.track: [project_id, track_id, points, warnings]

kpis:
  - id: K1
    name: North Star -- device-loaded full-trip GPX for a 20+ item real trip in <= 2 h planning time
    type: outcome
    target: "<= 2 h active planning time"
    baseline: ~2 days by hand (unvalidated estimate)
    instruments:
      primary: dogfood session timing (manual stopwatch, recorded in docs/demo/ at the slice-11 demo)
      secondary:
        diagnostics_field: k1.planning_span
        definition: >
          per project, active time from the first item created_at to the first export.gpx of a run with
          items_included >= 20, summing gaps between consecutive project activity timestamps
          (items.created_at, project_history.at, plan_job_log.started_at, plan_runs.first_exported_at)
          and capping each gap at 30 min (idle cut-off)
        needs: [items.created_at, plan_runs.first_exported_at, plan_runs.export_count]   # DV-4
    thresholds: {green: "<= 2 h", amber: "2-4 h", red: "> 4 h"}
    alert: none (outcome KPI, reviewed at the demo)

  - id: K2
    name: Plan runs violating HC-1/HC-2/HC-5
    type: guardrail
    target: 0
    instruments:
      ci: property tests (A-1, A-2, HC-5, A-7 over 1,000 generated projects incl. sparse/retrace), blocking
      runtime_event: invariant.violation
      diagnostics_field: k2.invariant_violations
      definition: count of plan_runs with status=failed AND failure_reason='internal invariant violation' (all time and last 30 days)
    thresholds: {green: 0, red: ">= 1"}
    alert: red badge on /diagnostics and a warning banner on the home page until acknowledged; treat as an incident (rollback candidate)

  - id: K3
    name: Plan runs omitting an item from the consideration report
    type: guardrail
    target: 0
    instruments:
      ci: A-3 property test (blocking)
      runtime_event: plan.run.completed (report_items vs project_items)
      diagnostics_field: k3.report_omissions
      definition: count of plan_runs where report_items != project_items (the guard should make this impossible; this is the independent check)
    thresholds: {green: 0, red: ">= 1"}
    alert: same as K2

  - id: K4
    name: Toggle-only Recalculates that needed routing requests
    type: leading
    target: 0%
    instruments:
      ci: A-4 acceptance tests with the CountingRoutingProvider (blocking)
      runtime_event: plan.job.finished (legs_new, points_new, provider_id)
      diagnostics_field: k4.toggle_only_with_requests_pct
      definition: >
        among done jobs whose points_new = 0 AND provider_id equals the previous job of the project
        (toggle/remove-only changes), the share with legs_new > 0
    thresholds: {green: 0%, red: "> 0%"}
    alert: red badge; investigate leg-key quantisation (DESIGN open question 5) before anything else

  - id: K5
    name: 60-item plan time on the Pi
    type: leading
    target: "e2e p95 <= 180 s over cold plans with exactly 60 items at make perf-pi (every run counts; retried jobs and second-pass P2 > 700 included; UD-3, D177); solve stage p95 <= 55 s"
    baseline: "measured 2026-11-01 (SPIKE-1R/2R): sum of stage p95s 63.7 s, 73.7 s with UI + reserve; solve 47.56 s (dense)"
    instruments:
      gate: "make perf-pi (planner-perf on the Pi, leg cache cleared, client-observed from the Mac; N=10 -> gate on max, N=30 -> p95). AUTHORITATIVE for K5: every run counts, none is dropped (D177). Solves the golden I1/I2 first and checks the order hash (D175)"
      proxy: "/api/diagnostics K5 fields are a server-side proxy over production jobs (leg cache usually warm, no client time); they inform, they never open or close the claim (D177, F-25)"
      runtime_event: plan.job.finished (stage_ms, elapsed_ms) + plan.run.geometry_served (e2e_server_ms)
      diagnostics_fields:
        k5.e2e_p95_by_band_s: "p95 of e2e_server_ms (done) or elapsed_ms (failed, cancelled: lower bound) per size band {le_30, 31_59, 60, 61_70}, last 30 days (report max when N < 20); only band 60 is compared with 180 s"
        k5.e2e_p95_s: same as band 60 (headline)
        k5.solve_p95_s: p95 of stage_ms.solve per size band (band 60 compared with 55 s)
        k5.stage_p95_s: per stage (snapshot, snap, matrix, second_pass, reach_model, spawn, solve, guard_persist, geometry)
        k5.retried_jobs: per band, jobs with retried=true (visibility; INCLUDED in the p95)
        k5.second_pass_gt_700_jobs: per band, jobs with second_pass_pairs > 700 (visibility; INCLUDED in the p95)
        k5.failed_jobs: per band, failed jobs of any reason (INCLUDED, elapsed_ms as lower bound; also shown separately)
        k5.cancelled_jobs: per band, jobs stopped by the user (INCLUDED, elapsed_ms as lower bound; also shown separately)
        k5.memo_hit_jobs: per band, jobs answered from the memo (shown separately; they are not cold plans)
      claim_population: "gate (authoritative): every make perf-pi run on the exactly-60-item fixture, leg cache cleared, ignore_memo=true; nothing dropped. Diagnostics (proxy): every non-memo plan job per size band, terminal state done, failed or cancelled; no silent exclusion (UD-3, re-review N-04). Band 61_70 is outside the 180 s claim (OD-2)"
      adr_alignment: "ADR-014 s1 to carry the same wording (upstream DV-12, architect)"
    thresholds:
      e2e: {green: "<= 120 s", amber: "120-180 s", red: "> 180 s"}
      solve: {green: "<= 50 s", amber: "50-55 s", red: "> 55 s"}
    alert: amber/red badge; red -> re-run make perf-pi, then recalibrate SOLVER_BUDGET (ADR-014 s1)

  - id: K6
    name: Exports that open in OsmAnd / Locus / Garmin
    type: outcome
    target: 100%
    instruments:
      ci: GPX 1.1 XSD validation of exports (blocking, leading proxy)
      manual: dogfood checklist per device (docs/demo/), at the slice 01b and 11 demos and the first real trip
      runtime_event: export.gpx (volume only)
    thresholds: {green: 100%, red: "< 100%"}
    alert: none (manual)

  - id: K7
    name: Variants tried per planning evening
    type: leading
    target: ">= 5"
    baseline: ~1
    instruments:
      diagnostics_field: k7.runs_per_project_day
      definition: count of plan_job_log rows with terminal_state=done per (project, local day), shown as median and max over the last 30 days with at least 1 run
    thresholds: {green: ">= 5", amber: "2-4", red: "<= 1"}
    alert: none (reviewed weekly)

guardrails:
  - id: G1
    name: Idle app RAM
    target: "< 300 MB (NFR-5), excluding Valhalla"
    instruments:
      diagnostics_fields: {g1.process_rss_mb: /proc/self/status VmRSS, g1.cgroup_memory_mb: /sys/fs/cgroup/memory.current}
      gate: "slice 01a and DoD item 5: docker stats after 10 min idle on the Pi (make diag records it); CI arm64 smoke records an advisory sample"
    thresholds: {green: "< 250 MB", amber: "250-300 MB", red: ">= 300 MB"}
  - id: G2
    name: Project data corruption on provider failure
    target: 0
    instruments:
      ci: gold fault catalogue + crash-consistency tests (blocking)
      diagnostics_fields: {g2.last_quick_check: result and time of the startup PRAGMA quick_check}
    thresholds: {green: quick_check ok, red: quick_check failed}
    accepted_risk: "No backups (user 2026-11-02, DEVOPS D91): device or NVMe loss = data loss, not measured by any KPI"
  - id: G3
    name: Offline test suite green
    target: 100% on main
    instruments: {ci: ci.yml on every push; make deploy refuses a SHA without a green run}
  - id: G4
    name: Routing engine availability while planning
    target: no refused jobs for engine not ready outside tile refresh windows
    instruments: {runtime_event: plan.job.refused (reason engine_not_ready), diagnostics_field: g4.engine_refusals_30d, healthcheck: valhalla /status}
    thresholds: {green: 0, amber: ">= 1"}

diagnostics_endpoint:
  path: GET /api/diagnostics       # JSON, behind Basic auth when enabled; page /diagnostics in the SPA
  query: {days: "default 30", project_id: optional}
  sources: [plan_job_log, plan_runs, items, project_history, /proc, /sys/fs/cgroup]
  cost: read-only SQL aggregates over at most a few thousand rows; must answer in < 200 ms on the Pi; never takes the write lock
  payload_keys: [version, process_started_at, k1, k2, k3, k4, k5, k7, g1, g2, g4, cache_hit_rate_30d, jobs_by_terminal_state_30d, retried_jobs_30d, second_pass_jobs_30d]
  available_from: "03-ops slice (with plan_job_log). Before that, make diag = docker stats --no-stream + /healthz only (D178; closes UI-16)"
  availability_slo: "none (D172): a single Pi cannot measure its own downtime; process_started_at + app_version are shown instead"
  cache_hit_rate: sum(legs_cached) / sum(legs_total) over done jobs

delivery_metrics:   # DORA (DEVOPS D101, D176). Source: releases.log on the Pi (copied to the Mac by every make deploy/rollback); computed by `make dora`
  source_fields: [ts, action, digest, git_sha, commit_ts, alembic_head, result, reason]   # commit_ts from OCI label org.overland.commit-ts
  window: rolling 30 days, and per slice
  metrics:
    - id: D-1
      name: Deployment frequency
      definition: count of action=deploy with result=ok (unchanged excluded) per slice and per 30 days
      target: ">= 1 per slice (about daily during DELIVER)"
    - id: D-2
      name: Lead time for changes
      definition: "median of (deploy ts - commit_ts) over successful deploys"
      target: "< 1 h"
    - id: D-3
      name: Change failure rate
      definition: "(deploys followed by auto-rollback, or by a manual rollback within 24 h) / successful + failed deploys"
      target: "< 15%"
    - id: D-4
      name: Time to restore
      definition: "ts of the rollback (or auto-rollback) that restored a healthy release - ts of the failed deploy"
      target: "< 15 min (make rollback)"
  alert: none (reviewed at each slice demo)

# ------------------------------------------------------------------------------------------------------------
# Acceptance links (added by DISTILL, 2026-11-02; feature-delta "## Wave: DISTILL", decisions D103-D120).
# Each KPI / guardrail -> the @kpi scenarios that prove the metric is producible or the guardrail holds.
# Files are under tests/acceptance/overland_route_planner_mvp/. gate: hard = blocking in CI (or the named make
# target); soft = observability only (the scenario proves the figure is emitted, not that the target is met).
# window: the measurement window the scenario or instrument uses.
acceptance_links:
  K1:
    gate: soft
    window: "per project, first item created_at -> first export of a run with >= 20 items"
    scenarios:
      - {file: slice-11-device-ready-gpx.feature, scenario: "The first export of a big trip records how long planning took"}
  K2:
    gate: hard
    window: "1,000 generated projects per property (Hypothesis profile ci); every run (guard)"
    scenarios:
      - {file: slice-02-directional-optimizer.feature, scenario: "No generated plan ever drives a track in reverse"}
      - {file: slice-02-directional-optimizer.feature, scenario: "Tracks are always driven in full"}
      - {file: slice-02-directional-optimizer.feature, scenario: "The trip always starts at Start and ends at End"}
      - {file: slice-02-directional-optimizer.feature, scenario: "A plan that would break a hard rule is never shown"}
      - {file: slice-03b-out-and-back-retrace.feature, scenario: "No track item is ever driven backwards, retraces included"}
      - {file: slice-03-pi-performance.feature, scenario: "Marco's diagnostics show how planning went"}
  K3:
    gate: hard
    window: "1,000 generated projects (property); every run (plan.run.completed report_items vs project_items)"
    scenarios:
      - {file: slice-04-consideration-list.feature, scenario: "Every project item is accounted for in the results"}
      - {file: slice-04-consideration-list.feature, scenario: "The report is complete for any project"}
      - {file: slice-03-pi-performance.feature, scenario: "Marco's diagnostics show how planning went"}
  K4:
    gate: hard
    window: "per Recalculate job (distinct legs requested at the routing port); diagnostics over 30 days"
    scenarios:
      - {file: slice-05-incremental-recalculation.feature, scenario: "Excluding an item makes zero new routing requests"}
      - {file: slice-05-incremental-recalculation.feature, scenario: "Adding one POI requests only the legs involving that POI"}
      - {file: slice-05-incremental-recalculation.feature, scenario: "Diagnostics count toggle-only recalculations that needed the routing engine"}
  K5:
    gate: "hard via make perf-pi (D96), never in GitHub CI; soft in the diagnostics scenario"
    window: "N=10 runs per gate (max = p95 of 10); diagnostics 30 days"
    scenarios:
      - {file: slice-03-pi-performance.feature, scenario: "The solve stage for 60 items fits the budget on the Pi", tags: "@requires_external @pi"}
      - {file: slice-06a-valhalla-on-the-pi.feature, scenario: "A 60-item trip with no known roads is on screen within 3 minutes", tags: "@requires_external @real_provider @pi"}
      - {file: slice-03-pi-performance.feature, scenario: "Marco's diagnostics show how planning went"}
  K6:
    gate: "hard for XSD validity (CI); manual for devices"
    window: "every exported file in tests; device checklist at the slice 01b and 11 demos"
    scenarios:
      - {file: slice-01b-skeleton-plan-and-gpx.feature, scenario: "Marco downloads the first plan as a standard GPX file"}
      - {file: slice-11-device-ready-gpx.feature, scenario: "The exported trip is standard GPX with real road shapes"}
      - {file: slice-11-device-ready-gpx.feature, scenario: "The whole trip opens in OsmAnd in itinerary order", tags: "@manual"}
  K7:
    gate: soft
    window: "per (project, local day), Europe/Rome"
    scenarios:
      - {file: slice-03-pi-performance.feature, scenario: "Marco's diagnostics show how planning went"}
  G1:
    gate: "hard at slice 01a / DoD 5 on the Pi (docker stats after 10 min idle)"
    window: "one sample after 10 min idle"
    scenarios:
      - {file: slice-00b-planner-on-the-pi.feature, scenario: "The idle planner leaves room on the Pi", tags: "@requires_external @pi"}
  G2:
    gate: hard
    window: "per provider failure in tests; startup quick_check at runtime"
    scenarios:
      - {file: slice-06a-valhalla-on-the-pi.feature, scenario: "Routing engine unreachable leaves the project intact"}
  G4:
    gate: soft
    window: "30 days of plan.job.refused with reason engine_not_ready"
    scenarios:
      - {file: slice-06a-valhalla-on-the-pi.feature, scenario: "The routing engine is still loading its map data"}
