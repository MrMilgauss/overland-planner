[project]
name = "overland-planner"
version = "0.0.0"
description = "Self-hosted overland route planner (direction-safe, fixed-anchor itineraries on a Raspberry Pi)"
readme = "REQUIREMENTS.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies from DESIGN "Technology choices". Exact pins are a DELIVER decision (slice 01a, D85),
# except ortools, which DEVOPS D85 pins exactly.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "gpxpy>=1.6,<1.7",
    "defusedxml>=0.7,<0.8",
    "httpx>=0.27",
    "structlog>=24",
    "python-multipart>=0.0.9",
    "ortools==9.15.6755",
    # The offline road map's MOCK_PLAN script (brief section 6, D220 f), parsed with yaml.safe_load only.
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-bdd>=8.1",
    "hypothesis>=6.100",
    "respx>=0.21",
    "xmlschema>=3.3",
    # State-delta port (Mandate 8). Re-exported by tests/common/state_delta.py.
    "nwave-ai>=3.21",
    # Tooling (DELIVER 01-01, D85): exact pins.
    "ruff==0.17.3",
    "mypy==2.4.1",
    "import-linter==2.15",
    "pytest-cov==7.1.0",
    "pre-commit==4.7.0",
    "types-PyYAML==6.0.12.20261030",
    # Mutation testing (D97): mutmut 3.x, exact pin.
    "mutmut==3.8.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/overland_planner"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["-ra", "--import-mode=importlib"]
bdd_features_base_dir = "tests/acceptance/overland_route_planner_mvp/"
# Tags become markers through tests/conftest.py (hyphens -> underscores). Unknown-mark warnings are expected for
# story/slice tags such as US_01a or slice_01a.
filterwarnings = ["ignore::pytest.PytestUnknownMarkWarning"]
markers = [
    "pending: scenario of a slice whose step definitions or behaviour are not built yet (skipped by default)",
    "walking_skeleton: the single end-to-end skeleton scenario of the feature",
    "requires_external: needs a system outside the offline suite (Pi, Docker, live Valhalla); skipped unless enabled",
    "real_provider: runs against live Valhalla on the Pi (make acceptance-pi), never in GitHub CI",
    "pi: runs on pi-host (make acceptance-pi / perf-pi), never in GitHub CI",
    "wiring_e2e: real uvicorn subprocess + real HTTP",
    "property: property-based scenario (Hypothesis) at layer 1-2",
    "slow: slower than the pre-push budget",
    "heavy_property: acceptance property, or unit/perf test at 3 s or more, too slow for job 2 at profile ci; runs in the slow-properties job (D221)",
    "golden_order: I1 and I2 planned against their blessed order (CI job 3 golden-order only, D96); also solver_child",
    "solver_child: spawns the OR-Tools child process (excluded from mutation runs)",
    "compose: checks the compose set-up with Docker (CI job 7, -m \"compose or security\")",
    "security: security check against the packaged planner, e.g. the container cannot write /app (D173, CI job 7)",
]

# Mutation testing (D97, DEVOPS mutation strategy): `make mutate BASE=<ref>` scopes the run to the changed domain and
# application files; kill rate = (killed + timeout) / (killed + timeout + survived + no_tests) >= 80 %.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/overland_planner/domain/*", "src/overland_planner/application/*"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/property", "tests/integration"]
pytest_add_cli_args = ["-m", "not solver_child", "-p", "no:cacheprovider"]
# The home-page integration tests serve the real web build (`make mutate` builds it first); every app start migrates
# the database with the repository's Alembic migrations (MIGRATIONS_DIR defaults to <repo>/migrations).
also_copy = ["web/dist/", "migrations/", "alembic.ini"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
# DISTILL-authored files that predate the ruff gate (step 01-01 may not edit them). Drop each entry the first time
# DELIVER edits the file and runs `ruff format` / `ruff check --fix` on it.
extend-exclude = [
    "tests/acceptance/overland_route_planner_mvp/conftest.py",
    "tests/acceptance/overland_route_planner_mvp/steps/platform_steps.py",
    "tests/acceptance/overland_route_planner_mvp/steps/world.py",
    "tests/common/state_delta.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and drive real processes they build themselves: uvicorn via sys.executable, git and
# lint-imports from the dev environment (S603, S607). No untrusted input reaches them.
"tests/**" = ["S101", "S603", "S607"]
# The CI contract compares the workflow's runner /tmp paths as strings; it never opens them (S108).
"tests/ci/**" = ["S101", "S603", "S607", "S108"]
# CI helper scripts call gh and docker from the runner PATH with arguments from our own package listing.
".github/scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["overland_planner"]
strict = true

[[tool.mypy.overrides]]
module = ["tests.*"]
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pytest_bdd.*", "gpxpy.*", "defusedxml.*", "xmlschema.*", "nwave_ai.*", "des.*", "ortools.*"]
ignore_missing_imports = true

# Brief section 11 layer and module contracts. Contract 6 (application facades) is added per module when its
# facade.py first appears (platform at 01-04, catalog at 02-02, planning at 04-01): ignore_imports that match nothing
# are errors.
[tool.importlinter]
root_package = "overland_planner"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: bootstrap > adapters > application > domain"
type = "layers"
layers = [
    "overland_planner.bootstrap",
    "overland_planner.adapters",
    "overland_planner.application",
    "overland_planner.domain",
]

[[tool.importlinter.contracts]]
id = "domain-forbidden"
name = "Domain forbidden: frameworks, I/O and logging"
type = "forbidden"
source_modules = ["overland_planner.domain"]
forbidden_modules = [
    "sqlalchemy", "alembic", "fastapi", "starlette", "pydantic", "httpx", "ortools", "gpxpy", "defusedxml",
    "structlog", "logging",
]

[[tool.importlinter.contracts]]
id = "application-forbidden"
name = "Application forbidden: infrastructure frameworks (logging via EventLog port)"
type = "forbidden"
source_modules = ["overland_planner.application"]
forbidden_modules = ["sqlalchemy", "fastapi", "starlette", "httpx", "ortools", "gpxpy", "structlog"]

[[tool.importlinter.contracts]]
id = "adapter-independence"
name = "Adapter independence"
type = "independence"
modules = [
    "overland_planner.adapters.http",
    "overland_planner.adapters.routing",
    "overland_planner.adapters.solver",
    "overland_planner.adapters.persistence",
    "overland_planner.adapters.files",
    "overland_planner.adapters.gpx",
    "overland_planner.adapters.geocoding",
    "overland_planner.adapters.logging",
]

[[tool.importlinter.contracts]]
id = "domain-catalog"
name = "Domain catalog does not import planning, export or routing"
type = "forbidden"
source_modules = ["overland_planner.domain.catalog"]
forbidden_modules = [
    "overland_planner.domain.planning",
    "overland_planner.domain.export",
    "overland_planner.domain.routing",
]

[[tool.importlinter.contracts]]
id = "domain-routing"
name = "Domain routing does not import planning or export"
type = "forbidden"
source_modules = ["overland_planner.domain.routing"]
forbidden_modules = ["overland_planner.domain.planning", "overland_planner.domain.export"]

[[tool.importlinter.contracts]]
id = "domain-planning"
name = "Domain planning does not import export"
type = "forbidden"
source_modules = ["overland_planner.domain.planning"]
forbidden_modules = ["overland_planner.domain.export"]

[[tool.importlinter.contracts]]
id = "facade-platform"
name = "Application facades: other modules reach platform only through its facade"
type = "forbidden"
source_modules = [
    "overland_planner.application.catalog",
    "overland_planner.application.export",
    "overland_planner.application.planning",
    "overland_planner.application.routing",
    "overland_planner.adapters",
    "overland_planner.bootstrap",
]
forbidden_modules = ["overland_planner.application.platform"]
ignore_imports = ["overland_planner.** -> overland_planner.application.platform.facade"]

[[tool.importlinter.contracts]]
id = "facade-catalog"
name = "Application facades: other modules reach catalog only through its facade"
type = "forbidden"
source_modules = [
    "overland_planner.application.export",
    "overland_planner.application.planning",
    "overland_planner.application.platform",
    "overland_planner.application.routing",
    "overland_planner.adapters",
    "overland_planner.bootstrap",
]
forbidden_modules = ["overland_planner.application.catalog"]
ignore_imports = ["overland_planner.** -> overland_planner.application.catalog.facade"]

[[tool.importlinter.contracts]]
id = "facade-planning"
name = "Application facades: other modules reach planning only through its facade"
type = "forbidden"
source_modules = [
    "overland_planner.application.catalog",
    "overland_planner.application.export",
    "overland_planner.application.platform",
    "overland_planner.application.routing",
    "overland_planner.adapters",
    "overland_planner.bootstrap",
]
forbidden_modules = ["overland_planner.application.planning"]
ignore_imports = ["overland_planner.** -> overland_planner.application.planning.facade"]

[[tool.importlinter.contracts]]
id = "facade-routing"
name = "Application facades: other modules reach routing only through its facade"
type = "forbidden"
source_modules = [
    "overland_planner.application.catalog",
    "overland_planner.application.export",
    "overland_planner.application.planning",
    "overland_planner.application.platform",
    "overland_planner.adapters",
    "overland_planner.bootstrap",
]
forbidden_modules = ["overland_planner.application.routing"]
ignore_imports = ["overland_planner.** -> overland_planner.application.routing.facade"]

[[tool.importlinter.contracts]]
id = "facade-export"
name = "Application facades: other modules reach export only through its facade"
type = "forbidden"
source_modules = [
    "overland_planner.application.catalog",
    "overland_planner.application.planning",
    "overland_planner.application.platform",
    "overland_planner.application.routing",
    "overland_planner.adapters",
    "overland_planner.bootstrap",
]
forbidden_modules = ["overland_planner.application.export"]
ignore_imports = ["overland_planner.** -> overland_planner.application.export.facade"]

[[tool.importlinter.contracts]]
id = "ortools-solver-only"
name = "ortools only in adapters.solver"
type = "forbidden"
# Direct imports only: the composition root reaches the solver adapter, which legitimately imports ortools.
allow_indirect_imports = true
source_modules = [
    "overland_planner.domain",
    "overland_planner.application",
    "overland_planner.bootstrap",
    "overland_planner.adapters.http",
    "overland_planner.adapters.routing",
    "overland_planner.adapters.persistence",
    "overland_planner.adapters.files",
    "overland_planner.adapters.gpx",
    "overland_planner.adapters.geocoding",
    "overland_planner.adapters.logging",
    "overland_planner.adapters.clock",
]
forbidden_modules = ["ortools"]
